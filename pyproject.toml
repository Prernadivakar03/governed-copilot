[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.pyright]
include = ["backend", "eval"]
extraPaths = ["backend", "eval", "backend/.venv/Lib/site-packages"]
venvPath = "backend"
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
    "unit: marks unit tests that require no external dependencies",
    "integration: marks integration tests that require live database or LLM services",
]

