version: 1

roles:
  analyst: [public, internal]
  steward: [public, internal, pii]

rules:
  - "Currency is Brazilian Real (BRL)."
  - "The order date is orders.order_purchase_timestamp."
  - "Revenue and sales questions count delivered orders only (orders.order_status = 'delivered') unless the user asks otherwise."
  - "To count customers use customers.customer_unique_id, because customer_id is created per order."
  - "Joining orders to both order_items and order_payments multiplies rows (fan-out). Aggregate each separately in subqueries before combining."
  - "Product category names in English are in category_translation.product_category_name_english."

tables:
  customers:
    description: "One row per customer record (a customer_id is issued per order)."
    columns:
      customer_id: {description: "Key used by orders", sensitivity: internal}
      customer_unique_id: {description: "Stable id of a real customer", sensitivity: internal}
      customer_zip_code_prefix: {description: "Zip code prefix", sensitivity: internal}
      customer_city: {description: "City", sensitivity: public}
      customer_state: {description: "Brazilian state code, e.g. SP", sensitivity: public}
      customer_email: {description: "Customer email (synthetic)", sensitivity: pii}
      customer_phone: {description: "Customer phone (synthetic)", sensitivity: pii}
  orders:
    description: "One row per order."
    columns:
      order_id: {description: "Order key", sensitivity: internal}
      customer_id: {description: "Links to customers.customer_id", sensitivity: internal}
      order_status: {description: "delivered, shipped, canceled, unavailable, invoiced, processing, created, approved", sensitivity: public}
      order_purchase_timestamp: {description: "When the order was placed", sensitivity: public}
      order_approved_at: {description: "Payment approval time", sensitivity: public}
      order_delivered_carrier_date: {description: "Handed to carrier", sensitivity: public}
      order_delivered_customer_date: {description: "Delivered to customer", sensitivity: public}
      order_estimated_delivery_date: {description: "Estimated delivery date", sensitivity: public}
  order_items:
    description: "One row per item in an order."
    columns:
      order_id: {description: "Links to orders.order_id", sensitivity: internal}
      order_item_id: {description: "Item sequence number within the order", sensitivity: internal}
      product_id: {description: "Links to products", sensitivity: internal}
      seller_id: {description: "Links to sellers", sensitivity: internal}
      shipping_limit_date: {description: "Seller shipping deadline", sensitivity: public}
      price: {description: "Item price in BRL", sensitivity: public}
      freight_value: {description: "Shipping cost in BRL", sensitivity: public}
  order_payments:
    description: "Payments for orders (an order can have several)."
    columns:
      order_id: {description: "Links to orders.order_id", sensitivity: internal}
      payment_sequential: {description: "Payment sequence number", sensitivity: internal}
      payment_type: {description: "credit_card, boleto, voucher, debit_card", sensitivity: public}
      payment_installments: {description: "Number of installments", sensitivity: public}
      payment_value: {description: "Amount paid in BRL", sensitivity: public}
  order_reviews:
    description: "Customer review scores for orders."
    columns:
      review_id: {description: "Review key", sensitivity: internal}
      order_id: {description: "Links to orders.order_id", sensitivity: internal}
      review_score: {description: "Score from 1 (worst) to 5 (best)", sensitivity: public}
      review_creation_date: {description: "Review creation date", sensitivity: public}
  products:
    description: "Product catalogue."
    columns:
      product_id: {description: "Product key", sensitivity: internal}
      product_category_name: {description: "Category name in Portuguese", sensitivity: public}
      product_name_lenght: {description: "Characters in product name", sensitivity: public}
      product_description_lenght: {description: "Characters in description", sensitivity: public}
      product_photos_qty: {description: "Number of photos", sensitivity: public}
      product_weight_g: {description: "Weight in grams", sensitivity: public}
      product_length_cm: {description: "Length in cm", sensitivity: public}
      product_height_cm: {description: "Height in cm", sensitivity: public}
      product_width_cm: {description: "Width in cm", sensitivity: public}
  sellers:
    description: "Marketplace sellers."
    columns:
      seller_id: {description: "Seller key", sensitivity: internal}
      seller_zip_code_prefix: {description: "Zip code prefix", sensitivity: internal}
      seller_city: {description: "Seller city", sensitivity: public}
      seller_state: {description: "Seller state code", sensitivity: public}
  category_translation:
    description: "Maps Portuguese category names to English."
    columns:
      product_category_name: {description: "Portuguese category name", sensitivity: public}
      product_category_name_english: {description: "English category name", sensitivity: public}

metrics:
  revenue:
    description: "Item revenue from delivered orders, excluding freight."
    expression: "SUM(order_items.price)"
    tables: [orders, order_items]
    filters: ["orders.order_status = 'delivered'"]
    owner: finance
    version: 1
    synonyms: [sales, turnover, income]
  gross_revenue_with_freight:
    description: "Item price plus freight for delivered orders."
    expression: "SUM(order_items.price + order_items.freight_value)"
    tables: [orders, order_items]
    filters: ["orders.order_status = 'delivered'"]
    owner: finance
    version: 1
    synonyms: ["gross revenue", "revenue including shipping"]
  order_count:
    description: "Number of distinct orders."
    expression: "COUNT(DISTINCT orders.order_id)"
    tables: [orders]
    owner: operations
    version: 1
    synonyms: ["number of orders", "total orders"]
  unique_customers:
    description: "Number of distinct real customers."
    expression: "COUNT(DISTINCT customers.customer_unique_id)"
    tables: [customers]
    owner: marketing
    version: 1
    synonyms: ["number of customers", "customer count"]
  avg_review_score:
    description: "Average review score (1-5)."
    expression: "AVG(order_reviews.review_score)"
    tables: [order_reviews]
    owner: operations
    version: 1
    synonyms: [rating, "customer satisfaction"]
  avg_order_value:
    description: "Item revenue divided by number of orders with items."
    expression: "SUM(order_items.price) / COUNT(DISTINCT order_items.order_id)"
    tables: [order_items]
    owner: finance
    version: 1
    synonyms: [aov, "average basket"]

joins:
  - {left: orders.customer_id, right: customers.customer_id, cardinality: many-to-one}
  - {left: order_items.order_id, right: orders.order_id, cardinality: many-to-one}
  - {left: order_items.product_id, right: products.product_id, cardinality: many-to-one}
  - {left: order_items.seller_id, right: sellers.seller_id, cardinality: many-to-one}
  - {left: order_payments.order_id, right: orders.order_id, cardinality: many-to-one}
  - {left: order_reviews.order_id, right: orders.order_id, cardinality: many-to-one}
  - {left: products.product_category_name, right: category_translation.product_category_name, cardinality: many-to-one}